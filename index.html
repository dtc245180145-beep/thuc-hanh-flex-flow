
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Flex Flow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f6f9;
        }

        h1 {
            text-align: center;
            color: #234;
        }

        h2 {
            color: #2457a7;
        }

        .container {
            display: flex;
            background-color: #f1f1f1;
            border: 2px solid #555;
            padding: 10px;
            margin-bottom: 30px;
        }

        .container div {
            background-color: #007bff;
            color: white;
            width: 100px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
            flex-shrink: 0;
        }

        /* Vi du 1 */
        .container-1 {
            flex-flow: row nowrap;
        }

        /* Vi du 2 */
        .container-2 {
            flex-flow: row-reverse nowrap;
        }

        .container-2 div {
            background-color: #28a745;
        }
    </style>
</head>

<body>
    <h1>THỰC HÀNH CSS FLEX-FLOW</h1>

    <h2>Ví dụ 1: flex-flow: row nowrap</h2>

    <p>
        Các item được sắp xếp theo hàng từ trái sang phải
        và không xuống dòng.
    </p>

    <div class="container container-1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

    <h2>Ví dụ 2: flex-flow: row-reverse nowrap</h2>

    <p>
        Các item được sắp xếp theo hàng theo hướng ngược lại,
        từ phải sang trái, và không xuống dòng.
    </p>

    <div class="container container-2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>
</body>
</html>
